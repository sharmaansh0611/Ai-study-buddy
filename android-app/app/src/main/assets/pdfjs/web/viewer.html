<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PDF Viewer</title>
  <link rel="stylesheet" href="viewer.css" />
</head>

<body>

  <div id="viewerContainer">
    <div id="loadingMessage">
      <div class="spinner"></div>
      <span>Loading document…</span>
    </div>
  </div>

  <!-- Floating Navigation UI -->
  <div id="nav-overlay">
    <div class="nav-bar">
      <input type="range" id="page-slider" min="1" value="1" step="1">
      <div class="page-info">
        <input type="number" id="current-page-input" min="1" value="1">
        <span>/</span>
        <span id="total-pages">1</span>
      </div>
    </div>
  </div>

  <script type="module">
    import * as pdfjsLib from '../build/pdf.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc = '../build/pdf.worker.mjs';

    const params = new URLSearchParams(window.location.search);
    const pdfUrl = params.get('file');
    const container = document.getElementById('viewerContainer');
    const slider = document.getElementById('page-slider');
    const pageInput = document.getElementById('current-page-input');
    const totalSpan = document.getElementById('total-pages');
    const navBar = document.querySelector('.nav-bar');

    let pdfDoc = null;
    let isNavigating = false;

    if (!pdfUrl) {
      showError('No PDF URL provided.');
    } else {
      waitForLayout(() => loadPdf(pdfUrl));
    }

    function waitForLayout(cb, attempts = 0) {
      if (container.clientWidth > 0) {
        cb();
      } else if (attempts < 20) {
        setTimeout(() => waitForLayout(cb, attempts + 1), 100);
      } else {
        cb();
      }
    }

    async function loadPdf(url) {
      try {
        const loadingTask = pdfjsLib.getDocument({ url });
        pdfDoc = await loadingTask.promise;

        container.innerHTML = '';
        totalSpan.textContent = pdfDoc.numPages;
        slider.max = pdfDoc.numPages;
        pageInput.max = pdfDoc.numPages;

        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
          const page = await pdfDoc.getPage(pageNum);
          await renderPage(page);
        }

        setupPageTracking();
        setupNavHandlers();
      } catch (err) {
        showError('Failed to load PDF: ' + (err.message || err));
      }
    }

    async function renderPage(page) {
      const outputScale = window.devicePixelRatio || 1;
      const availWidth = container.clientWidth || screen.width;
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = availWidth / baseViewport.width;
      const viewport = page.getViewport({ scale });

      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';
      pageDiv.id = `page-${page.pageNumber}`; // ID for navigation
      pageDiv.style.width = Math.floor(viewport.width) + 'px';
      pageDiv.style.height = Math.floor(viewport.height) + 'px';

      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";
      context.scale(outputScale, outputScale);

      pageDiv.appendChild(canvas);

      const textLayerDiv = document.createElement('div');
      textLayerDiv.className = 'textLayer';
      textLayerDiv.style.width = Math.floor(viewport.width) + "px";
      textLayerDiv.style.height = Math.floor(viewport.height) + "px";
      textLayerDiv.style.setProperty('--scale-factor', '1');
      textLayerDiv.style.setProperty('--total-scale-factor', '1');
      pageDiv.appendChild(textLayerDiv);

      container.appendChild(pageDiv);

      await page.render({ canvasContext: context, viewport: viewport }).promise;

      const textLayer = new pdfjsLib.TextLayer({
        textContentSource: page.streamTextContent(),
        container: textLayerDiv,
        viewport: viewport,
      });
      await textLayer.render();
    }

    function setupPageTracking() {
      const observer = new IntersectionObserver((entries) => {
        if (isNavigating) return;

        entries.forEach(entry => {
          if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
            const pageId = entry.target.id;
            const pageNum = parseInt(pageId.split('-')[1]);
            slider.value = pageNum;
            pageInput.value = pageNum;
          }
        });
      }, {
        root: null,
        threshold: 0.5
      });

      document.querySelectorAll('.page').forEach(page => observer.observe(page));
    }

    function setupNavHandlers() {
      slider.oninput = () => {
        isNavigating = true;
        const pageNum = parseInt(slider.value);
        pageInput.value = pageNum;
        scrollToPage(pageNum);
        setTimeout(() => isNavigating = false, 500);
      };

      pageInput.onchange = () => {
        let pageNum = parseInt(pageInput.value);
        if (isNaN(pageNum)) return;
        if (pageNum < 1) pageNum = 1;
        if (pageNum > pdfDoc.numPages) pageNum = pdfDoc.numPages;

        pageInput.value = pageNum;
        slider.value = pageNum;
        scrollToPage(pageNum);
      };

      // Premium Interaction: Auto-select text on focus
      pageInput.onfocus = () => {
        pageInput.select();
      };
    }

    // --- Auto-Hide Nav Bar Logic ---
    let navHideTimeout;
    function resetNavVisibility() {
      navBar.classList.remove('hidden');
      clearTimeout(navHideTimeout);
      navHideTimeout = setTimeout(() => {
        if (!isNavigating && document.activeElement !== pageInput) {
          navBar.classList.add('hidden');
        }
      }, 2500); // Hide after 2.5s of inactivity
    }

    container.addEventListener('scroll', resetNavVisibility);
    container.addEventListener('touchstart', resetNavVisibility);
    resetNavVisibility(); // Initial trigger

    function scrollToPage(pageNum) {
      const pageElement = document.getElementById(`page-${pageNum}`);
      if (pageElement) {
        pageElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function showError(msg) {
      container.innerHTML = '<div id="errorMessage"><span>⚠️ ' + msg + '</span></div>';
    }

    // --- Removed on-demand floating popup tracking ---
  </script>

</body>

</html>
